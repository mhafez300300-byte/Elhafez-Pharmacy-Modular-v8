name: Bootstrap v8 source (XZ)

on:
  push:
    paths:
      - 'bootstrap/READY-XZ'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble, verify and unpack source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/xz-* > /tmp/source.tar.xz.b64
          base64 -d /tmp/source.tar.xz.b64 > /tmp/source.tar.xz
          echo "aba59a32fa1a176619c5d139ee86b905b668694e661c98a9ccf1663e4aa74732  /tmp/source.tar.xz" | sha256sum -c -
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name bootstrap -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -rf bootstrap
          rm -f .bootstrap
          rm -rf .github

      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Elhafez Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "v8.0.0 TypeScript modular monolith source"
          git push origin HEAD:main
