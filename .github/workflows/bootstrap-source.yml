name: Bootstrap v8 source

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and unpack source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > /tmp/source.zip.b64
          base64 -d /tmp/source.zip.b64 > /tmp/source.zip
          unzip -q -o /tmp/source.zip -d /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name bootstrap -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -rf bootstrap
          rm -f .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Elhafez Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "v8.0.0 TypeScript modular monolith source"
          git push origin HEAD:main
