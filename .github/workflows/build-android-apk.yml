name: Build Elhafez Pharmacy Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - 'public/**'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate web application
        run: |
          npm install --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
          npm run check
          npm test

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 secret is required for a commercial release" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/release.keystore

      - name: Build signed release APK and AAB
        working-directory: android-app
        env:
          OWNER_CENTER_URL: ${{ vars.OWNER_CENTER_URL }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android-app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || (echo "Android signing secrets are incomplete" && exit 1)
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect release artifacts
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk Elhafez-Pharmacy-v7.0.45-release.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab Elhafez-Pharmacy-v7.0.45-release.aab

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Elhafez-Pharmacy-v7.0.45-Android
          path: |
            Elhafez-Pharmacy-v7.0.45-release.apk
            Elhafez-Pharmacy-v7.0.45-release.aab
          if-no-files-found: error
          retention-days: 30
