services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmaflow
      POSTGRES_USER: pharmaflow
      POSTGRES_PASSWORD: change_me
    volumes:
      - pharmaflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaflow -d pharmaflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://pharmaflow:change_me@postgres:5432/pharmaflow
      APP_SECRET: change-this-secret-before-production-1234567890
      BACKUP_DIR: /app/backups
    ports:
      - "3000:3000"
    volumes:
      - pharmaflow_backups:/app/backups
volumes:
  pharmaflow_pg:
  pharmaflow_backups:
