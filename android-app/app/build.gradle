plugins {
    id 'com.android.application'
}

def configuredOwnerUrl = (project.findProperty('OWNER_CENTER_URL') ?: System.getenv('OWNER_CENTER_URL') ?: '').toString().trim()
if (!configuredOwnerUrl) configuredOwnerUrl = 'https://elhafez-technology-owner-production.up.railway.app'
def safeOwnerUrl = configuredOwnerUrl.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.elhafeztechnology.pharmacy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.elhafeztechnology.pharmacy'
        minSdk 26
        targetSdk 35
        versionCode 70045
        versionName '7.0.45'
        buildConfigField 'String', 'OWNER_CENTER_URL', '"' + safeOwnerUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseStoreFile) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
